flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: true
  # Adaptive icon: the gradient ground and the bars are supplied separately so
  # launchers can parallax/mask them independently. Monochrome reuses the
  # foreground for Android 13+ themed icons.
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

  ios: true
  # iOS wants a full-bleed square and applies its own squircle mask, which is a
  # continuous curve slightly wider in the corners than the artwork's circular
  # one — feeding it the rounded source leaves white slivers there. Hence a
  # separate un-rounded, already-opaque source.
  image_path_ios: "assets/icon/icon_ios.png"
  # Belt and braces: App Store validation rejects any alpha channel at all.
  remove_alpha_ios: true

  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/icon/icon.png"

# Note: flutter_launcher_icons has no Linux target. The Linux icon is wired up
# manually at packaging time (see docs/PLAN.md, Phase 0).
