import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {   
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // ---------------------------------------------------------------
        // mPlayer fork of media_kit_libs_android_video 1.3.8.
        //
        // Upstream downloads the `default` flavour, whose FFmpeg whitelists
        // 58 decoders — ssa, ass, dvbsub, dvdsub, subrip, text and webvtt are
        // all there, but `pgssub` is not. PGS/HDMV (Blu-ray) subtitles
        // therefore fail with
        //
        //   Could not find subtitle decoder for format 'hdmv_pgs_subtitle'
        //
        // which is media-kit/media-kit#1269.
        //
        // The same build repository publishes a `full` flavour built with
        // --enable-decoders, so these are the *same* artefacts from the same
        // pipeline, only with the whitelist removed. It stays LGPLv3
        // (--disable-gpl --disable-nonfree --enable-version3) and costs about
        // 2 MB per ABI: 5.7 MB -> 7.8 MB for arm64.
        //
        // Version note: upstream pins v1.1.7, which has no `full` build — that
        // flavour first appears in v1.1.9, so that is what is used here. The
        // jar layout is unchanged (libmpv.so + libmediakitandroidhelper.so),
        // verified by extracting both.
        //
        // To move to a newer tag, download the four jars and recompute the
        // MD5s; the verification below is what makes a bad download loud
        // instead of a mysterious runtime crash.
        // ---------------------------------------------------------------
        def libmpvTag = "v1.1.9"
        def libmpvBase = "https://github.com/media-kit/libmpv-android-video-build/releases/download/${libmpvTag}"

        // Download all *.jar dependencies & verify their MD5 checksums.
        def filesToDownload = [
            ["url": "${libmpvBase}/full-arm64-v8a.jar", "md5": "73e62dffadbe8f7c919d2f5ee628f811", "destination": file("$buildDir/${libmpvTag}/full-arm64-v8a.jar")],
            ["url": "${libmpvBase}/full-armeabi-v7a.jar", "md5": "b707d621b508a0cd2dd347e9c7b8b1fe", "destination": file("$buildDir/${libmpvTag}/full-armeabi-v7a.jar")],
            ["url": "${libmpvBase}/full-x86_64.jar", "md5": "bba6ac2edf01e6bf3de63098433b6bd0", "destination": file("$buildDir/${libmpvTag}/full-x86_64.jar")],
            ["url": "${libmpvBase}/full-x86.jar", "md5": "5708d78dfe6cd53c56a8c12b5feb594e", "destination": file("$buildDir/${libmpvTag}/full-x86.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists()) {
                def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedMD5 != fileInfo.md5) {
                    destFile.delete()
                    println "MD5 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }

                def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculatedMD5 != fileInfo.md5) {
                    throw new GradleException("MD5 verification failed for ${destFile}")
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)