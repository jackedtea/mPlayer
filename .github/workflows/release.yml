name: Build & Release

# Scheduled, not on push: dev is built once a day and main every third day,
# so a burst of pushes is one build rather than one each. A day with nothing
# new is skipped — see "Already built?" in `prepare`.
#
# Scheduled runs always start from the default branch's copy of this file,
# whichever branch they build; `prepare` works out the branch from the cron
# line that fired, and every job checks that branch out explicitly.
#
# The two cron lines below are matched by text in `prepare` — change one
# there too. Times are UTC: 20:00 is 03:00 in Vietnam. `*/3` restarts each
# month, so main occasionally builds a day or two early around the 1st.
on:
  schedule:
    - cron: '0 20 * * *'    # dev, daily
    - cron: '0 21 */3 * *'  # main, every third day
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        type: choice
        options: [dev, main]
        default: dev
      force:
        description: Build even if this commit (dev) or version (main) is already released
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  # ---------------------------------------------------------------------------
  # Derive every name and flag once, so the three build jobs cannot disagree
  # about what they are producing.
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.built.outputs.skip }}
      branch: ${{ steps.meta.outputs.branch }}
      sha: ${{ steps.meta.outputs.sha }}
      is_dev: ${{ steps.meta.outputs.is_dev }}
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      artifact_base: ${{ steps.meta.outputs.artifact_base }}
      app_id_suffix: ${{ steps.meta.outputs.app_id_suffix }}
      version_name_suffix: ${{ steps.meta.outputs.version_name_suffix }}
    steps:
      # Which branch this run builds: the cron line for a scheduled run, the
      # chosen input for a manual one.
      - name: Pick the branch
        id: target
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then
            case "$SCHEDULE" in
              '0 20 * * *') BRANCH=dev ;;
              '0 21 */3 * *') BRANCH=main ;;
              *) echo "::error::Unknown schedule '$SCHEDULE'"; exit 1 ;;
            esac
          else
            BRANCH="${INPUT_BRANCH:-dev}"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.branch }}

      - name: Derive build metadata
        id: meta
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail

          # main is the only production branch; everything else is dev.
          if [ "$BRANCH" = "main" ]; then
            IS_DEV=false
          else
            IS_DEV=true
          fi

          # "1.0.0+1" -> "1.0.0"
          VERSION="$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          SHA="$(git rev-parse HEAD)"

          if [ "$IS_DEV" = "true" ]; then
            TAG="dev-${SHORT_SHA}"
            RELEASE_NAME="mPlayer ${VERSION}-dev.${SHORT_SHA}"
            ARTIFACT_BASE="mPlayer-${VERSION}-dev-${SHORT_SHA}"
            APP_ID_SUFFIX=".canary"
            VERSION_NAME_SUFFIX="-dev-${SHORT_SHA}"
          else
            TAG="v${VERSION}"
            RELEASE_NAME="mPlayer ${VERSION}"
            ARTIFACT_BASE="mPlayer-${VERSION}"
            APP_ID_SUFFIX=""
            VERSION_NAME_SUFFIX=""
          fi

          {
            echo "branch=$BRANCH"
            echo "sha=$SHA"
            echo "is_dev=$IS_DEV"
            echo "version=$VERSION"
            echo "short_sha=$SHORT_SHA"
            echo "tag=$TAG"
            echo "release_name=$RELEASE_NAME"
            echo "artifact_base=$ARTIFACT_BASE"
            echo "app_id_suffix=$APP_ID_SUFFIX"
            echo "version_name_suffix=$VERSION_NAME_SUFFIX"
          } >> "$GITHUB_OUTPUT"

          echo "Building $RELEASE_NAME (tag $TAG, dev=$IS_DEV)" >> "$GITHUB_STEP_SUMMARY"

      # A dev tag names the commit and a main tag names the version, so an
      # existing release means nothing new: no commits on dev since the last
      # build, or no version bump on main. Publishing over it would replace a
      # build people may already have installed with an identical one.
      - name: Already built?
        id: built
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "${FORCE:-false}" != "true" ] \
             && gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released; nothing to build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Android
  # ---------------------------------------------------------------------------
  android:
    name: Android APK
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # The suite pumps every route at all three breakpoints; a layout
      # regression should stop the release, not ship in it.
      - run: flutter analyze
      - run: flutter test

      # Both secret sets are passed in and chosen in shell rather than with a
      # `cond && A || B` expression: that operator falls through to B whenever
      # A is empty, which would sign a main build with the dev key in silence.
      - name: Select signing material
        id: keystore
        env:
          MAIN_KEYSTORE: ${{ secrets.KEYSTORE }}
          MAIN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MAIN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MAIN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEV_KEYSTORE: ${{ secrets.KEYSTORE_DEV }}
          DEV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD_DEV }}
          DEV_KEY_ALIAS: ${{ secrets.KEY_ALIAS_DEV }}
          DEV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD_DEV }}
          # The branch being built, not `GITHUB_REF_NAME`: a scheduled run's
          # ref is the default branch whichever branch it builds.
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          set -euo pipefail

          if [ "$BRANCH" = "main" ]; then
            B64="${MAIN_KEYSTORE:-}"
            STORE_PASSWORD="${MAIN_KEYSTORE_PASSWORD:-}"
            ALIAS="${MAIN_KEY_ALIAS:-}"
            KEY_PASSWORD="${MAIN_KEY_PASSWORD:-}"
          else
            B64="${DEV_KEYSTORE:-}"
            STORE_PASSWORD="${DEV_KEYSTORE_PASSWORD:-}"
            ALIAS="${DEV_KEY_ALIAS:-}"
            KEY_PASSWORD="${DEV_KEY_PASSWORD:-}"
          fi

          if [ -z "$B64" ]; then
            # Configuring secrets is a separate chore from getting the
            # pipeline green, so fall back rather than hard-failing — the
            # release notes and the Telegram message both say so loudly.
            echo "::warning::No keystore secret for '${BRANCH}'; the APK will be debug-signed."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYSTORE_FILE="${GITHUB_WORKSPACE}/android/app/ci-keystore.jks"
          echo "$B64" | base64 -d > "$KEYSTORE_FILE"

          # Gradle reads these from the environment; they stay masked in logs.
          {
            echo "KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "signed=true" >> "$GITHUB_OUTPUT"

      # One APK per ABI rather than one fat one: media_kit bundles an 11-15 MB
      # libmpv.so for each ABI, so a universal APK is about three times the size
      # any single device actually needs. Flutter's Gradle plugin offsets the
      # version code per ABI (armeabi-v7a 1000, arm64-v8a 2000, x86_64 3000).
      - name: Build APKs
        env:
          APP_ID_SUFFIX: ${{ needs.prepare.outputs.app_id_suffix }}
          VERSION_NAME_SUFFIX: ${{ needs.prepare.outputs.version_name_suffix }}
        run: flutter build apk --release --split-per-abi

      - name: Name the artifacts
        run: |
          set -euo pipefail
          BASE="${{ needs.prepare.outputs.artifact_base }}"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            mv "build/app/outputs/flutter-apk/app-${ABI}-release.apk" \
               "${BASE}-android-${ABI}.apk"
          done

      - name: Always remove the keystore
        if: always()
        run: rm -f "${{ github.workspace }}/android/app/ci-keystore.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ needs.prepare.outputs.artifact_base }}-android-*.apk
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows
  # ---------------------------------------------------------------------------
  windows:
    name: Windows EXE
    needs: prepare
    runs-on: windows-latest
    if: needs.prepare.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Android takes its `-dev-<sha>` from VERSION_NAME_SUFFIX in Gradle;
      # desktop has no such hook, so the whole name goes in as --build-name.
      # Without it a dev build reports plain `1.0.0`, and the updater, which
      # reads its channel off the version, follows the stable releases.
      - name: Build
        shell: bash
        run: |
          flutter build windows --release \
            --build-name "${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.version_name_suffix }}"

      # The exe alone will not run: media_kit ships libmpv-2.dll and Flutter
      # ships its own runtime beside it, so the whole Release folder is the
      # deliverable.
      - name: Package the Release folder
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath "${{ needs.prepare.outputs.artifact_base }}-windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: ${{ needs.prepare.outputs.artifact_base }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Linux
  #
  # Built on CI rather than locally because Flutter cannot cross-compile Linux
  # from a Windows host.
  #
  # Unlike every other platform, libmpv is *not* bundled here: media_kit_video
  # links it through pkg-config, so the build needs libmpv-dev and the running
  # machine needs libmpv itself. That is also why Linux never had the PGS
  # problem — a distro's libmpv is a complete build.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux bundle
    needs: prepare
    runs-on: ubuntu-22.04
    if: needs.prepare.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libmpv-dev mpv \
            libsecret-1-dev libjsoncpp-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # --build-name for the same reason as on Windows: the updater reads its
      # channel off the version, and only Android gets the suffix otherwise.
      - name: Build
        run: |
          flutter build linux --release \
            --build-name "${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.version_name_suffix }}"

      # Tar rather than zip: it preserves the executable bit, which a zip
      # extracted on Linux does not.
      - name: Package the bundle
        run: |
          set -euo pipefail
          tar -czf "${{ needs.prepare.outputs.artifact_base }}-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: ${{ needs.prepare.outputs.artifact_base }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [prepare, android, windows, linux]
    runs-on: ubuntu-latest
    # A skipped job would otherwise skip everything downstream of it, so the
    # results are checked by name instead. Every platform must succeed: a
    # release missing the desktop archives would not be rebuilt the next day
    # ("Already built?" sees the tag), and the desktop updater, finding no
    # asset for itself, would stay on the old build without a word.
    if: >-
      always()
      && needs.prepare.result == 'success'
      && needs.android.result == 'success'
      && needs.windows.result == 'success'
      && needs.linux.result == 'success'
    outputs:
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Compose release notes
        id: notes
        run: |
          set -euo pipefail
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "**Commit** \`${{ needs.prepare.outputs.short_sha }}\` on \`${{ needs.prepare.outputs.branch }}\`"
            echo ""
            if [ "${{ needs.prepare.outputs.is_dev }}" = "true" ]; then
              echo "Dev build — application id ends in \`.canary\` and the app calls itself **mPlayer (Dev)**, so it installs and reads alongside a release build."
            fi
            if [ "${{ needs.android.outputs.signed }}" != "true" ]; then
              echo ""
              echo "> **Warning**"
              echo "> No keystore secret was set for this branch, so the APKs are **debug-signed**. Do not distribute them."
            fi
            echo ""
            echo "| Artifact | Platform |"
            echo "|---|---|"
            echo "| \`${{ needs.prepare.outputs.artifact_base }}-android-arm64-v8a.apk\` | Android · 64-bit ARM |"
            echo "| \`${{ needs.prepare.outputs.artifact_base }}-android-armeabi-v7a.apk\` | Android · 32-bit ARM |"
            echo "| \`${{ needs.prepare.outputs.artifact_base }}-android-x86_64.apk\` | Android · x86_64 |"
            # Only when the build actually ran: a row naming a file nobody
            # can download is worse than no row.
            if [ "${{ needs.windows.result }}" = "success" ]; then
              echo "| \`${{ needs.prepare.outputs.artifact_base }}-windows-x64.zip\` | Windows x64 |"
            fi
            if [ "${{ needs.linux.result }}" = "success" ]; then
              echo "| \`${{ needs.prepare.outputs.artifact_base }}-linux-x64.tar.gz\` | Linux x64 |"
            fi
            echo ""
            echo "Android ships one APK per architecture — take \`arm64-v8a\` unless the"
            echo "device is an older 32-bit phone (\`armeabi-v7a\`) or an emulator"
            echo "(\`x86_64\`)."
            if [ "${{ needs.linux.result }}" = "success" ]; then
              echo ""
              echo "The Linux bundle links libmpv from the system: install \`libmpv2\`"
              echo "(or \`mpv\`) before running it."
            fi
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        id: publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          body: ${{ steps.notes.outputs.notes }}
          # Dev builds are prereleases and never become "latest".
          prerelease: ${{ needs.prepare.outputs.is_dev == 'true' }}
          make_latest: ${{ needs.prepare.outputs.is_dev == 'false' }}
          # The commit that was built — not `github.sha`, which on a
          # scheduled run is the default branch's head whatever was built.
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: artifacts/*
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Telegram
  # ---------------------------------------------------------------------------
  notify:
    name: Notify Telegram
    # `windows` and `linux` are here only so their results can be read when
    # composing the message; the `if` below already tolerates them skipping.
    needs: [prepare, android, release, windows, linux]
    runs-on: ubuntu-latest
    # Reports failures too — a silent pipeline is worse than a noisy one. A
    # run skipped for having nothing new says nothing: a daily "no change"
    # message is noise that teaches people to ignore the channel.
    if: >-
      always()
      && needs.prepare.result == 'success'
      && needs.prepare.outputs.skip != 'true'
    steps:
      - name: Send message
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not set; skipping."
            exit 0
          fi

          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          RUN_URL="${REPO_URL}/actions/runs/${GITHUB_RUN_ID}"

          BASE="${{ needs.prepare.outputs.artifact_base }}"
          DL="${REPO_URL}/releases/download/${{ needs.prepare.outputs.tag }}"
          NOTES_URL="${REPO_URL}/releases/tag/${{ needs.prepare.outputs.tag }}"

          if [ "${{ needs.release.result }}" = "success" ]; then
            STATUS="✅ Release published"
            OK=true
          else
            STATUS="❌ Build failed"
            OK=false
          fi

          if [ "${{ needs.prepare.outputs.is_dev }}" = "true" ]; then
            CHANNEL="dev"
          else
            CHANNEL="release"
          fi

          WARN=""
          if [ "${{ needs.android.outputs.signed }}" != "true" ]; then
            WARN="⚠️ APKs are debug-signed (no keystore secret)"
          fi

          # jq builds both the text and the JSON, so a branch name or release
          # title containing quotes cannot break the request — and every line
          # here stays indented, which a multi-line shell string would not.
          jq -n \
            --arg chat_id "$CHAT_ID" \
            --arg status "$STATUS" \
            --arg name "${{ needs.prepare.outputs.release_name }}" \
            --arg channel "$CHANNEL" \
            --arg branch "${{ needs.prepare.outputs.branch }}" \
            --arg sha "${{ needs.prepare.outputs.short_sha }}" \
            --arg warn "$WARN" \
            --arg ok "$OK" \
            --arg apk_arm64 "$DL/$BASE-android-arm64-v8a.apk" \
            --arg apk_arm32 "$DL/$BASE-android-armeabi-v7a.apk" \
            --arg apk_x64 "$DL/$BASE-android-x86_64.apk" \
            --arg win "$DL/$BASE-windows-x64.zip" \
            --arg linux "$DL/$BASE-linux-x64.tar.gz" \
            --arg has_win "${{ needs.windows.result }}" \
            --arg has_linux "${{ needs.linux.result }}" \
            --arg notes "$NOTES_URL" \
            --arg run "$RUN_URL" \
            '
             def link($url; $label): "<a href=\"" + $url + "\">" + $label + "</a>";

             # One direct link per artefact. Tapping a platform in Telegram
             # should start that download, not open a release page to hunt
             # through on a phone.
             # Only the platforms that were actually built. A link to a
             # file the release does not contain is a 404 on a phone, which
             # is worse than the line not being there.
             #
             # NO APOSTROPHES ANYWHERE IN THIS PROGRAM. The whole thing is a
             # single-quoted shell argument, so one closes the string early
             # and jq is left with no program at all — it exits 3 with
             # "Top-level program not given", which says nothing about where
             # the quote was. A comment is what did it once already.
             def downloads:
               "📱 Android " + link($apk_arm64; "arm64-v8a")
                 + " · " + link($apk_arm32; "armeabi-v7a")
                 + " · " + link($apk_x64; "x86_64") + "\n"
               + (if $has_win == "success"
                    then "🪟 " + link($win; "Windows x64") + "\n" else "" end)
               + (if $has_linux == "success"
                    then "🐧 " + link($linux; "Linux x64") + "\n" else "" end)
               + "\n"
               + link($notes; "Release notes") + " · " + link($run; "Logs");

             {
               chat_id: $chat_id,
               parse_mode: "HTML",
               disable_web_page_preview: true,
               text: ("<b>" + $status + "</b>\n"
                 + "<b>mPlayer</b> " + $name + "\n"
                 + "Channel: <code>" + $channel + "</code>\n"
                 + "Branch: <code>" + $branch + "</code> · Commit: <code>" + $sha + "</code>"
                 + (if $warn == "" then "" else "\n" + $warn end)
                 + "\n\n"
                 + (if $ok == "true" then downloads else link($run; "Logs") end))
             }' \
          | curl -sS -f -X POST \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -H 'Content-Type: application/json' \
              -d @- > /dev/null

          echo "Telegram notification sent."
